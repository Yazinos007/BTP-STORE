name: Run Scraper
on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # تسمح لك بتشغيله يدوياً من زر Run workflow

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - run: npm install
      - run: npx playwright install --with-deps chromium
      
      # 1. تشغيل السكربت وحفظ النتيجة
      - name: Run Scraper
        id: run_scraper
        run: |
          OUTPUT=$(node scraper.js)
          echo "$OUTPUT"
          # استخراج العدد من المخرج (بافتراض أن السكربت يطبع SUCCESS_COUNT:X)
          COUNT=$(echo "$OUTPUT" | grep "SUCCESS_COUNT" | cut -d':' -f2)
          echo "COUNT=${COUNT:-0}" >> $GITHUB_ENV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
      # 2. إرسال الإشعار لتيليجرام
      - name: Send Telegram Notification
        if: always() # لضمان عمل الإرسال حتى لو فشل السكربت
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="تقرير الروبوت: تم العثور على ${{ env.COUNT }} صفقات جديدة اليوم."
