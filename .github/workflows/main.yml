name: Run Scraper
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup and Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cd souqbtp-dashboard
          
          echo "--- 1. تثبيت المكتبات ---"
          npm install
          npx playwright install --with-deps chromium
          
          echo "--- 2. تشغيل السكربت مع كشف الأخطاء ---"
          # الأمر --trace-uncaught سيخرج لنا تفاصيل الخطأ البرمجي في الـ Logs
          node --trace-uncaught scraper.js
          
          echo "--- 3. إرسال النتيجة ---"
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage \
          -d chat_id=$CHAT_ID \
          -d text="تقرير الروبوت: تم التنفيذ بنجاح."
