name: Run Scraper
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # نستخدم 'find' للعثور على المجلد الصحيح الذي يحتوي على package.json تلقائياً
      - name: Setup and Run
        run: |
          # العثور على المجلد الذي يحتوي على package.json
          WORKING_DIR=$(find . -name "package.json" -exec dirname {} \;)
          cd "$WORKING_DIR"
          
          # تثبيت المكتبات وتشغيل السكربت
          npm install
          npx playwright install --with-deps chromium
          OUTPUT=$(node scraper.js)
          
          # إرسال التنبيه
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="تقرير الروبوت: تم الانتهاء من الفحص. النتيجة: $OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
      # 2. إرسال الإشعار لتيليجرام
      - name: Send Telegram Notification
        if: always() # لضمان عمل الإرسال حتى لو فشل السكربت
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="تقرير الروبوت: تم العثور على ${{ env.COUNT }} صفقات جديدة اليوم."
